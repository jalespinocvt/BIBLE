<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Verse Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="cross-icon">✝</div>
            <h1 class="main-title">Bible Verse</h1>
            <p class="subtitle">Daily Inspiration from God's Word</p>
        </header>

        <main class="main-content">
            <div class="verse-card" id="verseCard">
                <div class="verse-content">
                    <p class="verse-text" id="verseText">
                        For God so loved the world that he gave his one and only Son, 
                        that whoever believes in him shall not perish but have eternal life.
                    </p>
                    <p class="verse-reference" id="verseRef">John 3:16 (NIV)</p>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="newVerseBtn">
                    <span>✨</span> New Verse
                </button>
                <button class="btn btn-secondary" id="designBtn">
                    <span>🎨</span> Change Design
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; 2024 Bible Verse. All scripture quotations are from the NIV translation.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
